plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	maven { url "https://maven.terraformersmc.com/releases/" }
	maven { url 'https://maven.isxander.dev/releases' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Mod dependencies
	api "com.terraformersmc:modmenu:${project.mod_menu}"
	api "dev.isxander:yet-another-config-lib:${project.yacl}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Configure the sourcesJar task to include the Minecraft version in the filename
tasks.withType(Jar).configureEach {
	if (name == "sourcesJar") {
		archiveFileName = "${project.name}-${project.version}+${project.minecraft_version}-sources.jar"
	}
}

jar {
	// Configure the jar task to include the Minecraft version in the filename
	archiveFileName = "${project.name}-${project.version}+${project.minecraft_version}.jar"

	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}